name: Build splat-training worker image

# Builds and pushes the RunPod Serverless worker image (free-tier plan
# step B2, GPU path — docker/splat-worker/) to GHCR. A thin layer on top
# of nerfstudio's own official image (just `pip install runpod requests`
# + our handler.py), so this build is fast and needs no GPU itself — the
# GPU only matters when RunPod actually *runs* the pushed image, not when
# GitHub Actions builds it. Manual dispatch, since this only needs
# rebuilding when the worker code changes, not on every push.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "docker/splat-worker/**"
      - ".github/workflows/build-splat-worker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: docker/splat-worker
          push: true
          # Hardcoded lowercase rather than github.repository_owner
          # (Yannyenks) - GHCR image names must be lowercase and a
          # case-mismatched tag fails the push outright.
          tags: ghcr.io/yannyenks/spatial-splat-worker:latest
