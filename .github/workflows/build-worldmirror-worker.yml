name: Build WorldMirror worker image

# Builds and pushes the RunPod Serverless worker for Tencent HY-World 2.0
# WorldMirror (docker/worldmirror-worker/) to GHCR. Unlike the splat
# worker this image is large (CUDA runtime + compiled gsplat + ~5GB of
# baked-in weights), so the runner's preinstalled toolchains are removed
# first to free enough disk for the build.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "docker/worldmirror-worker/**"
      - ".github/workflows/build-worldmirror-worker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: docker/worldmirror-worker
          push: true
          # Lowercase on purpose: GHCR rejects mixed-case image names.
          tags: ghcr.io/yannyenks/spatial-worldmirror-worker:latest
