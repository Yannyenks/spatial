name: Estimate camera pose (COLMAP)

# Real structure-from-motion, run for free on GitHub's CPU-only runners
# instead of a paid GPU service (free-tier plan step B1 —
# docs/free-tier-roadmap.md). Deliberately NOT wired into the main
# synchronous AIJob pipeline: COLMAP on a handful of photos takes several
# minutes even on CPU, far past what a single pipeline stage or a Vercel
# serverless request can block on. Triggered per space (from the app's
# "Estimate real camera pose" button, or manually via "Run workflow"
# here), and replaces that space's placeholder camera-position ring with
# real, measured poses. Running the main "Analyze" step again afterwards
# resets back to the placeholder ring — reconstruction always rewrites the
# Scene from scratch — so re-run this after if that happens.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "CameraPoseJob id"
        required: true

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install COLMAP
        run: sudo apt-get update && sudo apt-get install -y colmap

      - name: Fetch job photos
        env:
          APP_URL: ${{ vars.APP_URL || 'https://spatial-experience-platform.vercel.app' }}
          CAMERA_POSE_SECRET: ${{ secrets.CAMERA_POSE_SECRET }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          mkdir -p images
          curl -sS -f "$APP_URL/api/internal/camera-pose-jobs/$JOB_ID/photos" \
            -H "Authorization: Bearer $CAMERA_POSE_SECRET" -o photos.json
          python3 scripts/colmap/download_photos.py photos.json images

      - name: Run COLMAP (feature extraction, matching, sparse mapping)
        env:
          # The apt-installed COLMAP binary links Qt even for CLI-only
          # subcommands and aborts immediately ("no Qt platform plugin
          # could be initialized", exit 134) on a headless runner with no
          # display - confirmed live on ubuntu-latest. `offscreen` is Qt's
          # own headless backend, COLMAP's documented workaround for CI.
          QT_QPA_PLATFORM: offscreen
        run: |
          colmap feature_extractor --database_path db.db --image_path images --ImageReader.single_camera 1
          colmap exhaustive_matcher --database_path db.db
          mkdir -p sparse
          colmap mapper --database_path db.db --image_path images --output_path sparse
          if [ -d sparse/0 ]; then
            colmap model_converter --input_path sparse/0 --output_path sparse/0 --output_type TXT
          fi

      - name: Report result
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL || 'https://spatial-experience-platform.vercel.app' }}
          CAMERA_POSE_SECRET: ${{ secrets.CAMERA_POSE_SECRET }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: python3 scripts/colmap/report_result.py
